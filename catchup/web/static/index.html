<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catchup 预览</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16191d; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --accent-soft: #e8efff; --voice: #7c3aed; --voice-soft: #f1eafe;
  --official: #047857; --official-soft: #e3f6ee; --warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --card: #171a21; --text: #e7e9ee; --muted: #9098a5; --line: #262b35;
    --accent: #7aa2ff; --accent-soft: #1d2a48; --voice: #b69bff; --voice-soft: #2a2145;
    --official: #4ccf9a; --official-soft: #133126; --warn: #f0b35a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 0 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 10px 0; border: 0; background: none; color: var(--muted); font: inherit;
  font-weight: 600; border-bottom: 2px solid transparent; cursor: pointer; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.summary { margin: 16px 0 6px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); }
.summary b { font-size: 17px; }
.summary p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; letter-spacing: .02em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  margin-bottom: 10px; }
.card.push { border-left: 3px solid var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.pill { padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
.pill.voice { background: var(--voice-soft); color: var(--voice); border-color: transparent; }
.pill.official { background: var(--official-soft); color: var(--official); border-color: transparent; }
.title { display: block; font-weight: 650; font-size: 16px; margin: 6px 0 4px; line-height: 1.4;
  overflow-wrap: anywhere; }
.desc { color: var(--muted); font-size: 13.5px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.why { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 13px; }
.why b { color: var(--accent); font-weight: 600; }
.why ul { margin: 2px 0 0; padding-left: 18px; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px;
  padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { color: var(--muted); }
.timeline { margin: 10px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); font-size: 13px; }
.timeline li { list-style: none; margin: 0 0 6px; position: relative; overflow-wrap: anywhere; }
.timeline li::before { content: ""; position: absolute; left: -19px; top: 7px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--accent); }
.timeline span { color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 99px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.bar { display: grid; grid-template-columns: minmax(0, 9em) 1fr 3em; gap: 10px; align-items: center;
  font-size: 13px; margin: 6px 0; }
.bar i { display: block; height: 8px; border-radius: 4px; background: var(--accent); }
.bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }
.note { color: var(--muted); font-size: 12px; margin-top: 24px; }
.score { margin-left: auto; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Catchup</h1><small id="gen">加载中…</small></div>
    <nav class="tabs">
      <button class="tab on" data-tab="push">今日推送</button>
      <button class="tab" data-tab="events">事件流</button>
      <button class="tab" data-tab="sources">来源</button>
    </nav>
  </header>
  <main id="main"></main>
  <p class="note">原型说明：排序是手写规则（兴趣关键词 + 来源等级 + 多源 + 热度 + 时间衰减），“追踪/不感兴趣”只存在本浏览器里，不会影响真实推送。</p>
</div>
<script>
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let data = null, tab = "push", filter = "全部";
let followed = new Set(store.get("followed")), muted = new Set(store.get("muted"));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(iso) {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return `${Math.max(1, Math.round(m))} 分钟前`;
  if (m < 1440) return `${Math.round(m / 60)} 小时前`;
  return `${Math.round(m / 1440)} 天前`;
}
function card(e, push) {
  const isF = followed.has(e.key);
  const pills = [
    e.tier === "official" ? `<span class="pill official">官方</span>` : "",
    ...e.topics.map(t => `<span class="pill ${t === "AI 语音" ? "voice" : ""}">${esc(t)}</span>`),
    `<span class="pill">${esc(e.kind)}</span>`,
  ].join("");
  const srcs = e.labels.join(" / ");
  const tl = e.signals.length > 1 ? `<ul class="timeline">${e.signals.map(s =>
    `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a> <span>· ${ago(s.time)} · ${esc(s.title.slice(0, 60))}</span></li>`).join("")}</ul>` : "";
  const why = e.reasons.length ? `<div class="why"><b>为什么推给你</b><ul>${e.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : "";
  return `<article class="card ${push ? "push" : ""}">
    <div class="meta">${pills}<span class="score">${e.score}</span></div>
    <a class="title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
    ${e.summary ? `<p class="desc">${esc(e.summary)}</p>` : ""}
    <div class="meta" style="margin-top:6px">${ago(e.time)} · ${esc(srcs)}</div>
    ${push ? why : ""}${tl}
    <div class="actions">
      <button class="btn ${isF ? "on" : ""}" data-follow="${esc(e.key)}">${isF ? "追踪中" : "持续追踪"}</button>
      <button class="btn ghost" data-mute="${esc(e.key)}">不感兴趣</button>
      ${push ? "" : `<button class="btn ghost" data-why="${esc(e.key)}">为什么排在这</button>`}
    </div>
    <div class="why" data-whybox="${esc(e.key)}" hidden><ul>${e.reasons.map(r => `<li>${esc(r)}</li>`).join("") || "<li>没有命中兴趣，仅按来源和时间排序</li>"}</ul></div>
  </article>`;
}

function render() {
  const main = document.getElementById("main");
  const live = data.events.filter(e => !muted.has(e.key));
  if (tab === "push") {
    const top = live.slice(0, data.push_count);
    const fl = live.filter(e => followed.has(e.key) && !top.includes(e));
    main.innerHTML = `<div class="summary"><b>今天只需要看 ${top.length} 条</b>
      <p>过去 ${data.window_hours} 小时采集 ${data.total_signals} 条信号，合并成 ${data.event_count} 个事件，其余已替你过滤。</p></div>
      <h2>重要变化</h2>${top.map(e => card(e, true)).join("") || `<div class="empty">暂时没有值得打扰你的事</div>`}
      <h2>追踪中</h2>${fl.map(e => card(e, false)).join("") || `<div class="empty">点“持续追踪”后，这里只显示该事件的新进展</div>`}`;
  } else if (tab === "events") {
    const kinds = ["全部", "AI 语音", "官方", "模型", "论文", "代码", "社区", "视频", "新闻"];
    const list = live.filter(e => filter === "全部" || e.topics.includes(filter) || e.kind === filter
      || (filter === "官方" && e.tier === "official"));
    main.innerHTML = `<div class="chips">${kinds.map(k => `<button class="chip ${k === filter ? "on" : ""}" data-filter="${k}">${k}</button>`).join("")}</div>
      <h2>${list.length} 个事件 · 按相关性排序</h2>${list.slice(0, 80).map(e => card(e, false)).join("") || `<div class="empty">这个分类下暂时没有内容</div>`}`;
  } else {
    const max = Math.max(...data.sources.map(s => s.count), 1);
    const run = s => !s.last_run ? "尚未运行"
      : s.last_run.error ? `<span style="color:var(--warn)">上次失败 · ${ago(s.last_run.started)}</span>`
      : `上次 ${ago(s.last_run.started)} · 新增 ${s.last_run.new}`;
    main.innerHTML = `<h2>过去 ${data.window_hours} 小时各来源信号数</h2>
      <div class="card">${data.sources.map(s => `<div class="bar"><span title="${esc(s.name)}">${esc(s.title)}</span><i style="width:${(s.count / max * 100).toFixed(1)}%"></i><span>${s.count}</span></div>
        <div class="meta" style="margin:-2px 0 8px">${run(s)}</div>`).join("")}</div>`;
  }
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b === t));
  } else if (t.dataset.filter) filter = t.dataset.filter;
  else if (t.dataset.follow) {
    const k = t.dataset.follow;
    followed.has(k) ? followed.delete(k) : followed.add(k);
    store.set("followed", [...followed]);
  } else if (t.dataset.mute) {
    muted.add(t.dataset.mute);
    store.set("muted", [...muted]);
  } else if (t.dataset.why) {
    const box = document.querySelector(`[data-whybox="${CSS.escape(t.dataset.why)}"]`);
    if (box) box.hidden = !box.hidden;
    return;
  } else return;
  render();
});

fetch("api/feed").then(r => r.json()).then(d => {
  data = d;
  document.getElementById("gen").textContent = "更新于 " + new Date(d.generated).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  render();
}).catch(e => { document.getElementById("main").innerHTML = `<div class="empty">加载失败：${esc(e)}</div>`; });
</script>
</body>
</html>
